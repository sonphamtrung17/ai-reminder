name: app
description: "A new Flutter project."
publish_to: 'none'
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  domain:
    path: ../domain
  shared:
    path: ../shared
  translate:
    path: ../translate
  network:
    path: ../network

  #Flutter Launcher Icons
  flutter_launcher_icons: ^0.14.4

  flutter_bloc: ^9.1.1
  auto_route: ^10.1.2
  flutter_screenutil: ^5.9.3

  #Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.5.1

  #Model
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  injectable_generator: ^2.8.1
  auto_route_generator: ^10.2.4

  #Model
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  melos: ^7.1.0

flutter:

  uses-material-design: true
  assets:
    - env/

flutter_intl:
  enabled: false
  class_name: S
  main_locale: vi
  arb_dir: lib/translate/l10n
  output_dir: lib/translate/generated