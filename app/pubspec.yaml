name: app
description: "A new Flutter project."
publish_to: 'none'
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  collection:

  domain:
    path: ../domain
  shared:
    path: ../shared
  translate:
    path: ../translate
  network:
    path: ../network

  #Flutter Launcher Icons
  flutter_launcher_icons:

  #Flutter Native Splash
  flutter_native_splash:

  flutter_bloc:
  auto_route:
  flutter_screenutil:

  #Dependency Injection
  get_it:
  injectable:

  #Model
  freezed_annotation:
  json_annotation:

  flutter_svg:

  cached_network_image:

  skeletonizer:

  flutter_slidable:

  image_picker:

  dotted_dashed_line:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints:
  build_runner:
  flutter_gen_runner:
  injectable_generator:
  auto_route_generator:

  #Model
  freezed:
  json_serializable:
  melos:

flutter_gen:
  output: lib/resource/generated

flutter:

  uses-material-design: true
  assets:
    - env/
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_intl:
  enabled: false
  class_name: S
  main_locale: vi
  arb_dir: lib/translate/l10n
  output_dir: lib/translate/generated